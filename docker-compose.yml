services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/raffle.db
      RECEIPTS_DIR: /data/receipts
      # Пусто по умолчанию (GOOGLE_SHEETS_CREDENTIALS_FILE в .env), если задан —
      # см. DECISIONS.md №44. Только backend читает этот файл (фоновый цикл),
      # каналам он не нужен.
      GOOGLE_SHEETS_CREDENTIALS_FILE: /data/secrets/google-sheets-credentials.json
    volumes:
      - ./data/db:/data
      - ./data/receipts:/data/receipts
      - ./data/backups:/backups
      - ./data/secrets:/data/secrets:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  channel-telegram:
    build:
      context: .
      dockerfile: docker/telegram.Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/raffle.db
      RECEIPTS_DIR: /data/receipts
    volumes:
      - ./data/db:/data
      - ./data/receipts:/data/receipts
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  channel-vk:
    build:
      context: .
      dockerfile: docker/vk.Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/raffle.db
      RECEIPTS_DIR: /data/receipts
    volumes:
      - ./data/db:/data
      - ./data/receipts:/data/receipts
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    driver: bridge
