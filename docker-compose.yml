services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/raffle.db
      RECEIPTS_DIR: /data/receipts
      POSTER_DIR: /data/posters
      # Backend поднимает свой собственный outbound-only TelegramChannel для
      # проактивных уведомлений (webhook/фоновая сверка — notify_payment_outcome
      # и др., см. app/services/notification_service.py, DECISIONS_LOG.md №24) —
      # ему, как и channel-telegram, нужен SOCKS5 через SSH-туннель (№71), иначе
      # он ходит в Bot API напрямую и периодически ловит TimeoutError, из-за чего
      # часть участников не получает уведомление об успешной оплате.
      TELEGRAM_PROXY_URL: socks5://ssh-tunnel:${SSH_TUNNEL_LOCAL_PORT:-1080}
    volumes:
      - ./data/db:/data
      - ./data/receipts:/data/receipts
      - ./data/posters:/data/posters
      - ./data/backups:/backups
    depends_on:
      ssh-tunnel:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  channel-telegram:
    build:
      context: .
      dockerfile: docker/telegram.Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/raffle.db
      RECEIPTS_DIR: /data/receipts
      POSTER_DIR: /data/posters
      # SOCKS5 через SSH-туннель (сервис ssh-tunnel ниже) вместо стороннего
      # прокси — см. DECISIONS_LOG.md №71. Собирается здесь, руками в .env
      # задавать не нужно.
      TELEGRAM_PROXY_URL: socks5://ssh-tunnel:${SSH_TUNNEL_LOCAL_PORT:-1080}
    volumes:
      - ./data/db:/data
      - ./data/receipts:/data/receipts
      - ./data/posters:/data/posters
    depends_on:
      backend:
        condition: service_healthy
      ssh-tunnel:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  ssh-tunnel:
    build:
      context: .
      dockerfile: docker/ssh-tunnel.Dockerfile
    env_file: .env
    environment:
      SSH_TUNNEL_HOST: ${SSH_TUNNEL_HOST}
      SSH_TUNNEL_PORT: ${SSH_TUNNEL_PORT:-22}
      SSH_TUNNEL_USER: ${SSH_TUNNEL_USER}
      SSH_TUNNEL_LOCAL_PORT: ${SSH_TUNNEL_LOCAL_PORT:-1080}
    volumes:
      - ${SSH_TUNNEL_PRIVATE_KEY_PATH:-./data/ssh/telegram_tunnel_ed25519}:/run/secrets/ssh_tunnel_key:ro
      - ${SSH_TUNNEL_KNOWN_HOSTS_PATH:-./data/ssh/known_hosts}:/run/secrets/known_hosts:ro
    networks: [internal]
    healthcheck:
      # CMD-SHELL, а не exec-форма — нужна подстановка $SSH_TUNNEL_LOCAL_PORT
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${SSH_TUNNEL_LOCAL_PORT:-1080}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  channel-vk:
    build:
      context: .
      dockerfile: docker/vk.Dockerfile
    env_file: .env
    environment:
      DATABASE_PATH: /data/raffle.db
      RECEIPTS_DIR: /data/receipts
      POSTER_DIR: /data/posters
    volumes:
      - ./data/db:/data
      - ./data/receipts:/data/receipts
      - ./data/posters:/data/posters
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  reverse-proxy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks: [internal]
    restart: unless-stopped

networks:
  internal:
    driver: bridge
