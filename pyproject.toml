[project]
name = "raffle-platform"
version = "0.1.0"
description = "Платформа розыгрышей цифровых постеров — общий пакет бизнес-логики (app/)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.13,<2.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "PyJWT>=2.8,<3.0",
    "python-dateutil>=2.9,<3.0",
    "phonenumbers>=8.13,<9.0",
    "structlog>=24.1,<25.0",
]

[project.optional-dependencies]
backend = [
    "fastapi>=0.110,<0.111",
    "uvicorn[standard]>=0.29,<0.30",
    "python-multipart>=0.0.9",
    "prometheus-client>=0.20,<0.21",
    "httpx>=0.27,<0.28",
    "openpyxl>=3.1,<4.0",
]
telegram = [
    "aiogram>=3.4,<4.0",
    "httpx>=0.27,<0.28",
    "aiohttp-socks>=0.11,<0.12",
    "qrcode[pil]>=7.4,<8.0",
]
vk = [
    "vkbottle>=4.10,<5.0",
    "qrcode[pil]>=7.4,<8.0",
]
dev = [
    "pytest>=8.1,<9.0",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<0.5",
    "black>=24.4,<25.0",
    "mypy>=1.9,<2.0",
    "faker>=24.0,<25.0",
    "freezegun>=1.4,<2.0",
    "types-python-dateutil",
    "types-openpyxl",
    "types-qrcode",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "backend", "channels", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
ignore = ["B008", "UP017"]  # UP017: датасинтаксис datetime.UTC (3.11+) — держим совместимость с 3.10 для локальной разработки, см. DECISIONS.md п.15

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "migrations/versions"

[tool.mypy]
python_version = "3.11"
mypy_path = "."
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true
exclude = ["frontend/", "migrations/"]

[[tool.mypy.overrides]]
module = "aiogram.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp_socks.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
